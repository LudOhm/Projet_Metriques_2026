<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Contactez-moi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Arial, sans-serif;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(135deg, #74ebd5, #9face6);
        }

        .container{
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
            width:100%;
            max-width:500px;
        }

        h1{
            text-align:center;
            margin-bottom:10px;
            color:#333;
        }

        p{
            text-align:center;
            color:#666;
            margin-bottom:30px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:#444;
        }

        input, textarea{
            width:100%;
            padding:12px;
            margin-bottom:20px;
            border:1px solid #ccc;
            border-radius:10px;
            font-size:16px;
            transition:0.3s;
        }

        input:focus, textarea:focus{
            border-color:#6c63ff;
            outline:none;
            box-shadow:0 0 8px rgba(108,99,255,0.3);
        }

        textarea{
            resize:none;
            height:120px;
        }

        button{
            width:100%;
            padding:15px;
            border:none;
            border-radius:10px;
            background:#6c63ff;
            color:white;
            font-size:18px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#574fd6;
        }

        .footer{
            margin-top:20px;
            text-align:center;
            color:#888;
            font-size:14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📩 Contact</h1>
        <p>Laissez-moi un message</p>

        <form>
            <label>Nom</label>
            <input type="text" placeholder="Votre nom">

            <label>Prénom</label>
            <input type="text" placeholder="Votre prénom">

            <label>Message</label>
            <textarea placeholder="Votre message..."></textarea>

            <button type="submit">Envoyer</button>
        </form>

        <div class="footer">
            Atelier Métriques 2026
        </div>
    </div>

</body>
</html>
