<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Atelier - Dashboard météo</title>

  <script src="https://www.gstatic.com/charts/loader.js"></script>

  <style>
    body{
      font-family: Arial;
      margin: 30px;
      background: #f5f7fb;
    }

    h1{
      text-align:center;
    }

    #chart{
      width: 100%;
      height: 500px;
      margin-top: 40px;
    }

    #status{
      text-align:center;
      margin-top:20px;
      color:#666;
    }
  </style>
</head>

<body>

<h1>🌤️ Atelier Météo - Répartition des précipitations</h1>

<div id="chart"></div>
<div id="status"></div>

<script>
google.charts.load('current', { packages:['corechart'] });
google.charts.setOnLoadCallback(init);

async function init(){
  const data = await fetchData();
  drawChart(data);
}

async function fetchData(){

  const res = await fetch("/atelier-data");
  const json = await res.json();

  let pluie = 0;
  let sec = 0;

  json.forEach(d => {
    if (d.precip > 2) pluie++;
    else sec++;
  });

  return [
    ["Type", "Jours"],
    ["🌧️ Pluvieux", pluie],
    ["☀️ Sec", sec]
  ];
}

function drawChart(rows){

  const data = google.visualization.arrayToDataTable(rows);

  const options = {
    title: "Répartition des jours pluvieux vs secs (Paris)",
    pieHole: 0.4,   // donut chart (différent de ce que tu as déjà utilisé)
  };

  const chart = new google.visualization.PieChart(
    document.getElementById("chart")
  );

  chart.draw(data, options);

  document.getElementById("status").innerText =
    "Données météo analysées sur 7 jours";
}

</script>

</body>
</html>
