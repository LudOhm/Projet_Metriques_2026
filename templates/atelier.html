<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Atelier Météo - Dashboard Humidité</title>

  <script src="https://www.gstatic.com/charts/loader.js"></script>

  <style>
    :root{
      --bg1:#0f172a;
      --bg2:#1e293b;
      --card: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.12);
      --text:#e2e8f0;
      --muted:#94a3b8;
    }

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      color: var(--text);
    }

    header{
      text-align:center;
      padding:30px 20px 10px;
    }

    h1{
      margin:0;
      font-size:28px;
    }

    #date{
      margin-top:8px;
      color: var(--muted);
      font-size:14px;
    }

    .container{
      max-width:1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:25px;
      margin-bottom:25px;
    }

    .card{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .title{
      text-align:center;
      font-size:18px;
      margin-bottom:10px;
    }

    .chart{
      width:100%;
      height:320px;
    }

    .weather{
      text-align:center;
      font-size:16px;
      line-height:1.6;
    }

    .badge{
      display:inline-block;
      margin-top:8px;
      padding:4px 10px;
      border-radius:12px;
      background: rgba(255,255,255,0.1);
      font-size:13px;
    }

    .footer{
      text-align:center;
      margin:30px 0;
      color: var(--muted);
      font-size:13px;
    }

    @media (max-width:900px){
      .grid{
        grid-template-columns: 1fr;
      }
    }

  </style>

  <script>

    google.charts.load("current", {packages:["corechart"]});
    google.charts.setOnLoadCallback(init);

    async function init(){
      setDate();
      const data = await fetchData();
      render(data);
    }

    function setDate(){
      const now = new Date();
      document.getElementById("date").innerText =
        "📅 " + now.toLocaleDateString("fr-FR", {
          weekday:"long",
          year:"numeric",
          month:"long",
          day:"numeric"
        });
    }

    async function fetchData(){
      const res = await fetch("/atelier-data");
      return await res.json();
    }

    // 🔥 conversion météo Open-Meteo
    function weatherText(code){
      const map = {
        0: "☀️ Ciel dégagé",
        1: "🌤️ Peu nuageux",
        2: "⛅ Partiellement nuageux",
        3: "☁️ Couvert",
        45: "🌫️ Brouillard",
        61: "🌧️ Pluie",
        71: "🌨️ Neige",
        80: "🌦️ Averses"
      };
      return map[code] || "🌡️ Variable";
    }

    function buildHumidity(city){
      return google.visualization.arrayToDataTable([
        ['Niveau', 'Heures'],
        ['Faible (<40%)', city.low],
        ['Normal (40-70%)', city.normal],
        ['Élevé (>70%)', city.high]
      ]);
    }

    function drawChart(id, title, cityData){

      const chart = new google.visualization.PieChart(
        document.getElementById(id)
      );

      chart.draw(buildHumidity(cityData), {
        title,
        is3D:true,
        pieSliceText:"percentage",
        legend: { position: "bottom" },
        backgroundColor: "transparent"
      });
    }

    function renderWeather(data){

      document.getElementById("lilleWeather").innerHTML = `
        🌡️ <b>${data.lille.temp}°C</b><br>
        ${weatherText(data.lille.weathercode)}<br>
        <span class="badge">💨 Vent ${data.lille.windspeed} km/h</span>
      `;

      document.getElementById("lyonWeather").innerHTML = `
        🌡️ <b>${data.lyon.temp}°C</b><br>
        ${weatherText(data.lyon.weathercode)}<br>
        <span class="badge">💨 Vent ${data.lyon.windspeed} km/h</span>
      `;
    }

    function render(data){

      drawChart("lilleChart", "💧 Lille", data.lille);
      drawChart("lyonChart", "💧 Lyon", data.lyon);

      renderWeather(data);
    }

  </script>
</head>

<body>

<header>
  <h1>🌦️ Dashboard Météo - Atelier Métriques</h1>
  <div id="date"></div>
</header>

<div class="container">

  <!-- MÉTÉO LIVE -->
  <div class="grid">

    <div class="card">
      <div class="title">🌍 Lille - météo actuelle</div>
      <div id="lilleWeather" class="weather"></div>
    </div>

    <div class="card">
      <div class="title">🌍 Lyon - météo actuelle</div>
      <div id="lyonWeather" class="weather"></div>
    </div>

  </div>

  <!-- GRAPHIQUES -->
  <div class="grid">

    <div class="card">
      <div class="title">💧 Humidité Lille</div>
      <div id="lilleChart" class="chart"></div>
    </div>

    <div class="card">
      <div class="title">💧 Humidité Lyon</div>
      <div id="lyonChart" class="chart"></div>
    </div>

  </div>

</div>

<div class="footer">
  Open-Meteo • Google Charts • Atelier Métriques 2026
</div>

</body>
</html>
