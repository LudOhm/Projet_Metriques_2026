<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Histogramme des températures de Paris</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://www.gstatic.com/charts/loader.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
    }

    h1 {
      text-align: center;
    }

    #chart_div {
      width: 100%;
      height: 600px;
    }

    #status {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>Prévisions météo Paris - Histogramme</h1>

  <div id="chart_div"></div>
  <div id="status"></div>

  <script>
    google.charts.load("current", { packages:["corechart"] });
    google.charts.setOnLoadCallback(init);

    async function init() {
      try {
        const rows = await fetchParisData();
        drawChart(rows);
      } catch(error) {
        document.getElementById("status").textContent =
          "Erreur : " + error.message;
      }
    }

    async function fetchParisData() {
      const response = await fetch("/paris");

      if (!response.ok) {
        throw new Error("Impossible de récupérer l'API /paris");
      }

      const json = await response.json();

      // transforme le JSON en tableau pour Google Charts
      return json.map(item => [
        Number(item.temperature_c)
      ]);
    }

    function drawChart(rows) {
      const data = new google.visualization.DataTable();

      data.addColumn('number', 'Température (°C)');
      data.addRows(rows);

      const options = {
        title: 'Distribution des températures à Paris (7 jours)',
        legend: { position: 'none' },
        colors: ['#4285F4'],
        histogram: {
          bucketSize: 2
        }
      };

      const chart =
        new google.visualization.Histogram(
          document.getElementById('chart_div')
        );

      chart.draw(data, options);

      document.getElementById("status").textContent =
        "OK : " + rows.length + " températures chargées.";
    }
  </script>

</body>
</html>
